<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarNote</title>
  <meta name="description" content="车辆记录管理系统 - 记录油耗、保养、配件等信息">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#101828">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="default">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('carnote_theme') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#000000' : '#101828');
        var locale = localStorage.getItem('carnote_locale');
        if (locale) document.documentElement.lang = locale;
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
