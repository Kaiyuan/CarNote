# CarNote Docker Compose 配置
# 包含后端 API 服务和可选的 PostgreSQL 数据库

version: '3.8'

services:
  # 主应用服务 (包含前后端)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carnote
    ports:
      - "53300:53300"
    environment:
      - NODE_ENV=production
      - PORT=53300
      - DB_TYPE=sqlite
      - SQLITE_PATH=/app/data/carnote.db
      # - DB_TYPE=postgresql
      # - PG_HOST=172.20.0.1
      # - PG_PORT=5432
      # - PG_DATABASE=carnote
      # - PG_USER=carnote
      # - PG_PASSWORD=postgresqlPassword
      - UPLOAD_PATH=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=http://localhost
      # 可信反向代理（默认信任本机/内网代理）；无代理直接暴露公网时设为 false
      - TRUST_PROXY=loopback, linklocal, uniquelocal
      # SMTP 配置 (可选)
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=465
      # - SMTP_USER=user@example.com
      # - SMTP_PASS=password
      # - SMTP_SECURE=true
      # - SMTP_FROM=CarNote <noreply@example.com>
    volumes:
      - ${carnote_data}:/app/data
      - ${carnote_uploads}:/app/uploads
      # mod 目录：将 vip/ 文件夹内容放入此 volume 下的 vip/ 子目录即可启用 VIP 功能
      # 例如：将 vip/backend/ 和 vip/frontend/ 复制到 <carnote_mod>/vip/ 下
      - ${carnote_mod:-carnote_mod}:/app/mod
    # restart: always 确保 PG 容器重启后 app 也会被 Docker 自动重启以重建连接池
    restart: always
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:53300/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carnote-network

  # ──────────────────────────────────────────────────────────────────
  # 可选：内置 PostgreSQL 服务（启用时取消注释，并修改 app 的 DB_TYPE 等配置）
  # 若使用外部 PG，删除此 service，PG_HOST 填写外部 IP/主机名即可。
  # ──────────────────────────────────────────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: carnote-postgres
  #   restart: always
  #   environment:
  #     - POSTGRES_DB=carnote
  #     - POSTGRES_USER=carnote
  #     - POSTGRES_PASSWORD=postgresqlPassword
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U carnote -d carnote"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s
  #   networks:
  #     - carnote-network

# 数据卷
volumes:
  carnote_data:
    driver: local
  carnote_uploads:
    driver: local
  # mod volume：默认自动创建，如需映射到宿主机特定路径请在 .env 中设置 carnote_mod=/host/path/to/mod
  carnote_mod:
    driver: local
  # postgres_data:
  #   driver: local

# 网络
networks:
  carnote-network:
    driver: bridge
